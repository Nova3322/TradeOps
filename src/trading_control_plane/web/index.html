<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b100f">
    <meta name="description" content="生产交易提案、审核、执行、资金与风险控制台">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/assets/tradingops-logo.png" type="image/png">
    <link rel="apple-touch-icon" href="/assets/tradingops-logo.png">
    <link rel="stylesheet" href="/assets/styles.css?v=66">
    <title>交易控制台</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" data-link aria-label="交易控制台首页">
          <span class="brand-mark" aria-hidden="true"><img src="/assets/tradingops-logo.png" alt=""></span>
          <span><b>交易控制台</b><small>生产交易管理</small></span>
        </a>
        <div class="topbar-actions">
          <label id="scope-control" class="scope-control" hidden>
            <span>当前范围</span>
            <select id="scope-switcher" class="scope-switcher" aria-label="当前 Workspace 和团队"></select>
          </label>
          <span id="environment-badge" class="env-badge">控制台</span>
          <button id="language-toggle" class="icon-button language-button" type="button" aria-label="切换中英文">中英切换</button>
          <button id="theme-toggle" class="icon-button theme-button" type="button" aria-label="切换主题"><span aria-hidden="true">◐</span><span data-theme-label>主题</span></button>
          <div id="identity-chip" class="identity-chip" hidden></div>
          <button id="mobile-nav-toggle" class="mobile-nav-toggle" type="button" aria-controls="sidebar" aria-expanded="false" hidden>菜单</button>
        </div>
      </header>

      <aside id="sidebar" class="sidebar" hidden>
        <nav aria-label="主导航">
          <div class="nav-section" data-nav-section>
            <p class="nav-section-label">工作台</p>
            <a href="/" data-link><span>⌂</span>当前任务</a>
            <a href="/opportunities" data-link data-nav-capability="opportunity.view"><span>⌁</span>实时机会</a>
            <a href="/reviews" data-link data-nav-capability="proposal.review"><span>✓</span>审核队列</a>
            <a href="/campaigns" data-link data-nav-capability="operations.view"><span>◎</span>交易任务</a>
            <a href="/results" data-link data-nav-capability="results.view"><span>▦</span>绩效报表</a>
          </div>
          <div class="nav-section" data-nav-section>
            <p class="nav-section-label">团队配置</p>
            <a href="/signals" data-link data-nav-capability="signal.view"><span>⌖</span>信号源</a>
            <a href="/venues" data-link data-nav-capability="venue.view"><span>◫</span>交易账户</a>
            <a href="/shadow" data-link data-nav-capability="venue.view"><span>◐</span>影子模式</a>
            <a href="/notifications" data-link data-nav-capability="notification.view"><span>◌</span>通知中心</a>
          </div>
          <div class="nav-section" data-nav-section>
            <p class="nav-section-label">治理与安全</p>
            <a href="/positions" data-link data-nav-capability="system.view"><span>↕</span>系统状态</a>
            <a href="/capital" data-link data-nav-capability="capital.view"><span>¤</span>资金中心</a>
            <a href="/admin/users" data-link data-nav-capability="access.manage"><span>◇</span>成员权限</a>
            <a href="/admin/agents" data-link data-nav-capability="access.manage"><span>◈</span>AI Agent</a>
          </div>
        </nav>
        <div class="sidebar-foot">
          <div id="mobile-session-summary" class="mobile-session-summary"></div>
          <div><span class="status-dot"></span> 业务数据库已连接</div>
          <div>数据缺失时自动阻止交易</div>
          <button id="logout-button" class="text-button">退出当前会话</button>
        </div>
      </aside>
      <button id="nav-backdrop" class="nav-backdrop" type="button" aria-label="关闭主导航" hidden></button>

      <main id="main" class="main-content" aria-live="polite">
        <section class="loading-state"><span class="spinner"></span><p>正在读取当前事实…</p></section>
      </main>
    </div>

    <dialog id="system-proposal-dialog">
      <form id="system-proposal-form" method="dialog" class="dialog-form">
        <div class="dialog-head">
          <div><p class="eyebrow">PERPTAPE 机会</p><h2>保存候选并提交审核</h2></div>
          <button type="button" class="icon-button" data-close-dialog aria-label="关闭">×</button>
        </div>
        <input name="candidate_id" type="hidden">
        <div class="proposal-default">
          <div><small>当前卡片配置</small><b>正在读取服务端默认配置</b></div>
          <span class="tag">可修改</span>
        </div>
        <details class="advanced-settings">
          <summary>高级参数</summary>
        <div class="field-grid">
          <label>账户<input name="account_id" required></label>
          <label>风险档位<select name="risk_tier" required><option value="" selected disabled>请选择</option><option value="LOW">低</option><option value="MEDIUM">中</option><option value="HIGH">高</option></select></label>
          <label>请求数量<input name="quantity" type="number" step="any" min="0" required></label>
          <label>初仓数量<input name="initial_quantity" type="number" step="any" min="0"></label>
          <label>最大风险<input name="max_risk" type="number" step="any" min="0" required></label>
          <label>失效价格<input name="invalidation_price" type="number" step="any" min="0" required></label>
          <label>允许自动加仓<select name="allow_auto_add"><option value="false" selected>否</option><option value="true">是</option></select></label>
          <label>可用加仓次数<select name="requested_adds"><option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
          <label>加仓触发价格<input name="add_trigger_price" type="number" step="any" min="0"></label>
          <label>有效时间（小时，至少 8 小时）<input name="expires_in_hours" type="number" min="8" max="24" value="8" required></label>
        </div>
        <label>人工补充理由<textarea name="rationale" rows="3" required></textarea></label>
        </details>
        <p class="safety-note">提交只创建生产交易提案。突破信号不会绕过审核、风控和授权直接产生订单。</p>
        <div id="system-form-error" class="form-error" role="alert"></div>
        <div class="dialog-actions"><button type="button" class="secondary" data-close-dialog>取消</button><button class="primary" type="submit">按此配置创建</button></div>
      </form>
    </dialog>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <form method="dialog" class="dialog-form confirm-form">
        <div class="dialog-head">
          <div><p class="eyebrow">请再次确认</p><h2 id="confirm-title">确认此操作？</h2></div>
          <button type="submit" value="cancel" class="icon-button" aria-label="取消并关闭">×</button>
        </div>
        <p id="confirm-message" class="confirm-message"></p>
        <div class="dialog-actions">
          <button type="submit" value="cancel" class="secondary">取消</button>
          <button id="confirm-submit" type="submit" value="confirm" class="danger">确认并继续</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/assets/app.js?v=156"></script>
  </body>
</html>
