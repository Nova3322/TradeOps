services:
  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres-local
    environment:
      POSTGRES_DB: trading_local
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: local-trading-only
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_local"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - trading-postgres-local:/var/lib/postgresql/data

volumes:
  trading-postgres-local:
