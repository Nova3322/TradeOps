services:
  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres-local
    environment:
      POSTGRES_DB: trading_local
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: local-trading-only
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_local"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - trading-postgres-local:/var/lib/postgresql/data

  freqtrade-binance:
    image: freqtradeorg/freqtrade:2026.7
    profiles: ["execution-workers"]
    command:
      - trade
      - --config
      - /freqtrade/config.json
      - --strategy
      - ControlPlaneOnlyStrategy
      - --strategy-path
      - /freqtrade/strategies
    environment:
      FREQTRADE__API_SERVER__USERNAME: ${TRADING_FREQTRADE_API_USERNAME:-trading-control}
      FREQTRADE__API_SERVER__PASSWORD: ${TRADING_FREQTRADE_API_PASSWORD:-local-dry-run-only}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./freqtrade/config-binance.json:/freqtrade/config.json:ro
      - ./freqtrade/strategies:/freqtrade/strategies:ro
      - freqtrade-binance-data:/freqtrade/user_data

  freqtrade-hyperliquid:
    image: freqtradeorg/freqtrade:2026.7
    profiles: ["execution-workers"]
    command:
      - trade
      - --config
      - /freqtrade/config.json
      - --strategy
      - ControlPlaneOnlyStrategy
      - --strategy-path
      - /freqtrade/strategies
    environment:
      FREQTRADE__API_SERVER__USERNAME: ${TRADING_FREQTRADE_API_USERNAME:-trading-control}
      FREQTRADE__API_SERVER__PASSWORD: ${TRADING_FREQTRADE_API_PASSWORD:-local-dry-run-only}
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./freqtrade/config-hyperliquid.json:/freqtrade/config.json:ro
      - ./freqtrade/strategies:/freqtrade/strategies:ro
      - freqtrade-hyperliquid-data:/freqtrade/user_data

  freqtrade-binance-live-smoke:
    image: freqtradeorg/freqtrade:2026.7
    profiles: ["live-smoke"]
    command:
      - trade
      - --config
      - /freqtrade/config.json
      - --strategy
      - ControlPlaneOnlyStrategy
      - --strategy-path
      - /freqtrade/strategies
    environment:
      PYTHONPATH: /freqtrade/patches
      FREQTRADE__API_SERVER__USERNAME: ${TRADING_FREQTRADE_API_USERNAME:-trading-control}
      FREQTRADE__API_SERVER__PASSWORD: ${TRADING_FREQTRADE_API_PASSWORD:-local-live-smoke-only}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${TRADING_FREQTRADE_LIVE_JWT_SECRET:-local-live-smoke-jwt-override-required}
      FREQTRADE__DRY_RUN: ${TRADING_FREQTRADE_BINANCE_LIVE_DRY_RUN:-true}
      FREQTRADE__FORCE_ENTRY_ENABLE: ${TRADING_FREQTRADE_BINANCE_FORCE_ENTRY_ENABLE:-false}
      FREQTRADE__INITIAL_STATE: ${TRADING_FREQTRADE_BINANCE_INITIAL_STATE:-stopped}
      FREQTRADE__EXCHANGE__KEY: ${TRADING_BINANCE_API_KEY:-}
      FREQTRADE__EXCHANGE__SECRET: ${TRADING_BINANCE_API_SECRET:-}
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - ./freqtrade/config-binance-live-smoke.json:/freqtrade/config.json:ro
      - ./freqtrade/patches:/freqtrade/patches:ro
      - ./freqtrade/strategies:/freqtrade/strategies:ro
      - freqtrade-binance-live-smoke-data:/freqtrade/user_data

  freqtrade-hyperliquid-live-smoke:
    image: freqtradeorg/freqtrade:2026.7
    profiles: ["live-smoke"]
    command:
      - trade
      - --config
      - /freqtrade/config.json
      - --strategy
      - ControlPlaneOnlyStrategy
      - --strategy-path
      - /freqtrade/strategies
    environment:
      FREQTRADE__API_SERVER__USERNAME: ${TRADING_FREQTRADE_API_USERNAME:-trading-control}
      FREQTRADE__API_SERVER__PASSWORD: ${TRADING_FREQTRADE_API_PASSWORD:-local-live-smoke-only}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${TRADING_FREQTRADE_LIVE_JWT_SECRET:-local-live-smoke-jwt-override-required}
      FREQTRADE__DRY_RUN: ${TRADING_FREQTRADE_HYPERLIQUID_LIVE_DRY_RUN:-true}
      FREQTRADE__FORCE_ENTRY_ENABLE: ${TRADING_FREQTRADE_HYPERLIQUID_FORCE_ENTRY_ENABLE:-false}
      FREQTRADE__INITIAL_STATE: ${TRADING_FREQTRADE_HYPERLIQUID_INITIAL_STATE:-stopped}
      FREQTRADE__EXCHANGE__WALLET_ADDRESS: ${TRADING_HYPERLIQUID_FREQTRADE_WALLET_ADDRESS:-}
      FREQTRADE__EXCHANGE__PRIVATE_KEY: ${TRADING_HYPERLIQUID_API_WALLET_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:8084:8080"
    volumes:
      - ./freqtrade/config-hyperliquid-live-smoke.json:/freqtrade/config.json:ro
      - ./freqtrade/strategies:/freqtrade/strategies:ro
      - freqtrade-hyperliquid-live-smoke-data:/freqtrade/user_data

volumes:
  trading-postgres-local:
  freqtrade-binance-data:
  freqtrade-hyperliquid-data:
  freqtrade-binance-live-smoke-data:
  freqtrade-hyperliquid-live-smoke-data:
