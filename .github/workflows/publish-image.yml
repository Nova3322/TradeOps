name: Publish image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-image-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Resolve immutable release metadata
        id: release
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Source SHA must be exactly 40 lowercase hexadecimal characters." >&2
            exit 2
          }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || {
            echo "Checked-out commit does not match the tested source SHA." >&2
            exit 2
          }
          python - <<'PY' >>"$GITHUB_OUTPUT"
          import ast
          import os
          import re
          import tomllib
          from pathlib import Path

          source_sha = os.environ["SOURCE_SHA"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          module = ast.parse(Path("src/trading_control_plane/database.py").read_text())
          schema_revision = ""
          for node in module.body:
              if not isinstance(node, ast.Assign) or len(node.targets) != 1:
                  continue
              target = node.targets[0]
              if isinstance(target, ast.Name) and target.id == "REQUIRED_SCHEMA_REVISION":
                  schema_revision = ast.literal_eval(node.value)
                  break
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?", version):
              raise SystemExit("Project version is not an immutable release version")
          if not re.fullmatch(r"[0-9]{8}_[0-9]{4}", schema_revision):
              raise SystemExit("Schema revision is missing or malformed")
          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          print(f"source_sha={source_sha}")
          print(f"version={version}")
          print(f"schema_revision={schema_revision}")
          print(f"image=ghcr.io/{owner}/tradeops")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}:sha-${{ steps.release.outputs.source_sha }}
          build-args: |
            SOURCE_SHA=${{ steps.release.outputs.source_sha }}
            VERSION=${{ steps.release.outputs.version }}
            SCHEMA_REVISION=${{ steps.release.outputs.schema_revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.source_sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            io.tradeops.source-sha=${{ steps.release.outputs.source_sha }}
            io.tradeops.schema-revision=${{ steps.release.outputs.schema_revision }}
          provenance: mode=max
          sbom: true

      - name: Publish GitHub build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record immutable release coordinates
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION: ${{ steps.release.outputs.version }}
          SCHEMA_REVISION: ${{ steps.release.outputs.schema_revision }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Published image digest is invalid." >&2
            exit 2
          }
          {
            echo "## Published TradeOps image"
            echo
            echo "- Image: \`$IMAGE@$DIGEST\`"
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Version: \`$VERSION\`"
            echo "- Schema Revision: \`$SCHEMA_REVISION\`"
            echo "- SBOM: attached to the GHCR image as an OCI attestation"
            echo "- Build provenance: published as a GitHub artifact attestation"
          } >>"$GITHUB_STEP_SUMMARY"
