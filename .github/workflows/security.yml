name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod 0755 gitleaks
      - name: Verify prospective public tree
        run: python scripts/verify_public_release.py --gitleaks-bin "$PWD/gitleaks"
      - name: Dependency advisories
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.17 pip-audit==2.9.0
          uv export --all-groups --frozen --no-emit-project --no-hashes --format requirements-txt > /tmp/requirements.txt
          pip-audit --requirement /tmp/requirements.txt
          npm audit --package-lock-only --omit=dev --audit-level=high
