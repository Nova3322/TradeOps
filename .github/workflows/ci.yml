name: CI

on:
  pull_request:
  push:
    branches: [main, codex/trading-production-validation]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/uv-cache
  UV_LINK_MODE: copy

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-py312-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-py312-
      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.17
          uv sync --all-groups --frozen
      - name: Static and publication checks
        run: |
          uv run ruff check .
          uv run mypy src
          uv run python scripts/generate_publication_metadata.py --check
          uv run python scripts/verify_public_release.py

  unit:
    name: unit-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [general, stream-pending, stream-rest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-py312-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-py312-
      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.17
          uv sync --all-groups --frozen
      - name: Run unit and API shard
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET" in
            general)
              uv run pytest -q tests/unit tests/api \
                --ignore=tests/unit/test_perptape_stream.py
              ;;
            stream-pending)
              uv run pytest -q \
                tests/unit/test_perptape_stream.py::test_pending_window_fails_closed_at_2049_without_eviction_or_more_io
              ;;
            stream-rest)
              uv run pytest -q tests/unit/test_perptape_stream.py \
                -k 'not test_pending_window_fails_closed_at_2049_without_eviction_or_more_io'
              ;;
            *)
              echo "Unknown unit target: $TARGET" >&2
              exit 2
              ;;
          esac

  integration:
    name: integration-${{ matrix.shard }}-of-3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
          POSTGRES_DB: trading_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading -d trading_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TRADING_DATABASE_URL: postgresql+psycopg://trading:trading@127.0.0.1:5432/trading_test
      TEST_DATABASE_URL: postgresql+psycopg://trading:trading@127.0.0.1:5432/trading_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-py312-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-py312-
      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.17
          uv sync --all-groups --frozen
      - name: Validate migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Run integration shard
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL_SHARDS: 3
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t selected < <(python - <<'PY'
          import os
          from pathlib import Path

          shard = int(os.environ["SHARD"]) - 1
          total = int(os.environ["TOTAL_SHARDS"])
          bins: list[tuple[int, list[Path]]] = [(0, []) for _ in range(total)]
          files = sorted(
              Path("tests/integration").glob("test_*.py"),
              key=lambda path: (-path.stat().st_size, str(path)),
          )
          for path in files:
              target = min(range(total), key=lambda index: (bins[index][0], index))
              size, paths = bins[target]
              paths.append(path)
              bins[target] = (size + path.stat().st_size, paths)
          for path in sorted(bins[shard][1]):
              print(path)
          PY
          )
          printf 'Shard %s/%s: %s\n' "$SHARD" "$TOTAL_SHARDS" "${selected[*]}"
          test "${#selected[@]}" -gt 0
          uv run pytest -q "${selected[@]}"

  node:
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Run Node tests
        run: |
          npm run test:notilt
          npm run test:safe-spending

  test:
    name: test
    if: ${{ always() }}
    needs: [static, unit, integration, node]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          NODE_RESULT: ${{ needs.node.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$NODE_RESULT" = success
