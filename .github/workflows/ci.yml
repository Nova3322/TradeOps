name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
          POSTGRES_DB: trading_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading -d trading_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TRADING_DATABASE_URL: postgresql+psycopg://trading:trading@127.0.0.1:5432/trading_test
      TEST_DATABASE_URL: postgresql+psycopg://trading:trading@127.0.0.1:5432/trading_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked toolchain and dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.17
          uv sync --all-groups --frozen
          npm ci --ignore-scripts
      - name: Static checks
        run: |
          uv run ruff check .
          uv run mypy src
          uv run python scripts/generate_publication_metadata.py --check
          uv run python scripts/verify_public_release.py
      - name: Database and tests
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run pytest -q
          npm run test:notilt
          npm run test:safe-spending
