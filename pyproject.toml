[project]
name = "trading-control-plane"
version = "0.1.0"
description = "Fail-closed trading governance and operations control plane"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-only OR LicenseRef-TradingOPS-Commercial-1.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "alembic>=1.18.5,<2",
  "cryptography>=50,<51",
  "fastapi>=0.128,<1",
  "hyperliquid-python-sdk>=0.24,<0.25",
  "prometheus-client>=0.23,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.12,<3",
  "pyfolio-reloaded==0.9.9",
  "quantstats==0.0.81",
  "sqlalchemy>=2.0.51,<2.1",
  "uvicorn[standard]>=0.40,<1",
  "websockets>=15,<18",
]

[project.urls]
Homepage = "https://github.com/nineheavens223-sys/TradeOps"
Repository = "https://github.com/nineheavens223-sys/TradeOps.git"
Issues = "https://github.com/nineheavens223-sys/TradeOps/issues"
Security = "https://github.com/nineheavens223-sys/TradeOps/security/advisories/new"

[project.scripts]
trading-api = "trading_control_plane.__main__:main"
trading-doctor = "trading_control_plane.operations:main"
trading-notification-worker = "trading_control_plane.notification_runtime:main"
trading-sync-worker = "trading_control_plane.runtime:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_control_plane"]

[tool.hatch.build.targets.wheel.force-include]
"docs/AI_API_QUICKSTART.md" = "trading_control_plane/web/AI_API_QUICKSTART.md"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database",
]

[tool.coverage.run]
branch = true
source = ["trading_control_plane"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
  "DynamicPositionSizing-",
  "low_vol_breakout_bn",
  "交易系统 notion 文档",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trading_control_plane"]
