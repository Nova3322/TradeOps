[project]
name = "trading-control-plane"
version = "0.1.0"
description = "Open-source control layer for trading policy, approval, execution, reconciliation, and audit"
authors = [{name = "Nova3322", email = "165258092+Nova3322@users.noreply.github.com"}]
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-only OR LicenseRef-TradingOPS-Commercial-1.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "alembic>=1.18.5,<2",
  "ccxt==4.5.74",
  "cryptography>=49,<51",
  "fastapi>=0.128,<1",
  "hyperliquid-python-sdk>=0.24,<0.25",
  "prometheus-client>=0.23,<1",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6.0.2,<7",
  "pydantic-settings>=2.12,<3",
  "pyfolio-reloaded==0.9.9",
  "quantstats==0.0.81",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0.51,<2.1",
  "uvicorn[standard]>=0.40,<1",
  "websockets>=15,<18",
]

[project.urls]
Homepage = "https://github.com/Nova3322/TradeOps"
Repository = "https://github.com/Nova3322/TradeOps.git"
Issues = "https://github.com/Nova3322/TradeOps/issues"
Security = "https://github.com/Nova3322/TradeOps/security/advisories/new"

[project.scripts]
trading-api = "trading_control_plane.__main__:main"
trading-doctor = "trading_control_plane.operations:main"
trading-notification-worker = "trading_control_plane.notification_runtime:main"
trading-sync-worker = "trading_control_plane.runtime:main"
trading-fact-adapter = "trading_control_plane.fact_adapter_runtime:main"
trading-execution-worker = "trading_control_plane.execution_runtime:main"
trading-capital-worker = "trading_control_plane.capital_runtime:main"
trading-freqtrade-provision = "trading_control_plane.freqtrade_provision:main"
tradeops-config = "trading_control_plane.production_config:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.18,<3",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_control_plane"]

[tool.hatch.build.targets.wheel.force-include]
"docs/AI_API_QUICKSTART.md" = "trading_control_plane/web/AI_API_QUICKSTART.md"
"docs/API_KEY_QUICKSTART.md" = "trading_control_plane/web/API_KEY_QUICKSTART.md"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
filterwarnings = [
  "error",
  # FastAPI 0.x currently re-exports Starlette's TestClient through the deprecated
  # httpx compatibility path. Keep this third-party-only exception exact and tested.
  "ignore:Using `httpx` with `starlette\\.testclient` is deprecated; install `httpx2` instead\\.:starlette.exceptions.StarletteDeprecationWarning:fastapi\\.testclient",
  # pyfolio-reloaded imports optional Zipline support before TradingOPS can enter its
  # local warning boundary. These two dependency warnings are exact and tested.
  'ignore:Module "zipline\.assets" not found; multipliers will not be applied to position notionals\.:UserWarning:pyfolio\.pos',
  "ignore:The 'generic' unit for NumPy timedelta is deprecated, and will raise an error in the future\\. This includes implicit conversion of bare integers \\(e\\.g\\. `\\+ 1`\\)\\.Please use a specific unit instead\\.:DeprecationWarning:pyfolio\\.round_trips",
]
markers = [
  "integration: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database",
]

[tool.coverage.run]
branch = true
source = ["trading_control_plane"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
  "DynamicPositionSizing-",
  "low_vol_breakout_bn",
  "交易系统 notion 文档",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trading_control_plane"]
